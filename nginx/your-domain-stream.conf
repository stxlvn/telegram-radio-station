# Streaming-only vhost, deliberately NOT behind a CDN/reverse proxy.
#
# Why this file exists at all: putting the site behind Cloudflare (orange
# cloud) broke listener accounting outright. A CDN never sees an endless
# audio response as "complete", so it keeps pulling the stream from the
# origin long after the listener has closed the tab -- every visit leaves
# a permanent phantom connection that Icecast goes on counting as a
# listener. Measured on a live station: 66 of 69 "listeners" were orphans
# arriving one per 10s and never leaving, against 11 real client
# connections, growing without bound until proxy_read_timeout expired.
#
# The fix is to route only the long-lived connections around the CDN.
# Point stream.your-domain.tld at the relay(s) with DNS-only / grey
# cloud; the site itself can stay proxied. Icecast already answers with
# Access-Control-Allow-Origin: *, so the player works cross-origin
# (including hls.js, which needs real CORS) with no extra headers here.
#
# Both relays serve this name, so the round-robin means Let's Encrypt may
# validate against either. Issue the cert on ONE relay and have the other
# proxy /.well-known/acme-challenge/ to it (see the commented block
# below), then copy the cert across from a --deploy-hook on renewal.

upstream stream_backend {
    server YOUR_BACKEND_IP:8000 max_fails=2 fail_timeout=10s;
    server YOUR_BACKUP_BACKEND_IP:8000 backup;
}

upstream stream_icy_flac_backend {
    server YOUR_BACKEND_IP:8010 max_fails=2 fail_timeout=10s;
    server YOUR_BACKUP_BACKEND_IP:8010 backup;
}

# Same ICY-metadata split the main relay vhost makes -- see
# your-domain-relay.conf for the reasoning.
map $http_icy_metadata $stream_flac_backend {
    default        stream_backend;
    "1"            stream_icy_flac_backend;
}
map $http_icy_metadata $stream_flac_path {
    default        "/stream-web.flac";
    "1"            "/stream.flac";
}

server {
    listen 80;
    server_name stream.your-domain.tld;

    location /.well-known/acme-challenge/ {
        # On the relay that issues the cert, serve it from disk:
        root /var/www/your-domain.tld;
        # On the other relay, proxy it to the issuing one instead, so the
        # token is served whichever host Let's Encrypt happens to hit:
        # proxy_pass http://YOUR_ISSUING_RELAY_IP;
        # proxy_set_header Host $host;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name stream.your-domain.tld;

    ssl_certificate /etc/letsencrypt/live/stream.your-domain.tld/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stream.your-domain.tld/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Same proxy settings as the main vhost's stream locations -- this
    # host exists to keep those connections off the CDN, not to behave
    # differently. If the relay has several addresses and only one of
    # them routes to the backend (or is the one on the backend's
    # relay-only firewall allowlist), add:
    #   proxy_bind YOUR_RELAY_EGRESS_IP;
    # to every location below. A missing bind here fails as a silent
    # hang, not an error.
    location /radio/stream {
        proxy_pass http://stream_backend/stream;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 5s;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /radio/stream.flac {
        proxy_pass http://$stream_flac_backend$stream_flac_path;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 5s;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /radio/hls/ {
        proxy_pass http://YOUR_BACKEND_IP:8000/hls/;
        proxy_set_header Host $host;
        proxy_buffering off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /radio/hls-flac/ {
        proxy_pass http://YOUR_BACKEND_IP:8000/hls-flac/;
        proxy_set_header Host $host;
        proxy_buffering off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Nothing else belongs on this name.
    location / { return 404; }
}
